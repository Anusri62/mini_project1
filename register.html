<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookNest - Register</title>

    <link rel="stylesheet" href="../CSS/register.css">

</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">
            📚 BookNest
        </div>

        <nav>
            <a href="../pages/login.html">Login</a>
        </nav>

    </header>


    <!-- Register Section -->
    <main class="register-section">

        <div class="register-box">

            <div class="register-icon">
                📖
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join BookNest Library today
            </p>


            <!-- Register Form -->
            <form onsubmit="registerUser(event)">

                <!-- Name -->
                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="input-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter 10 digit phone number"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- Address -->
                <div class="input-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your address"
                        required
                    ></textarea>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Terms -->
                <div class="terms">

                    <label>

                        <input type="checkbox" id="terms" required>

                        I agree to the Terms & Conditions

                    </label>

                </div>


                <!-- Register Button -->
                <button type="submit" class="register-btn">
                    Create Account
                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="../pages/login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="../Js/register.js"></script>

</body>

</html>
